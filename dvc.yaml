stages:
  prepare:
    cmd: uv run python scripts/prepare.py
    deps:
      - data/raw
      - scripts/prepare.py
    params:
      - base.seed
      - prepare.output_dir
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  train:
    cmd: uv run python src/arabic_sentiment_mlops/train.py
    deps:
      - src/arabic_sentiment_mlops/callbacks.py
      - data/processed/train.csv
      - src/arabic_sentiment_mlops/train.py
      - pyproject.toml
      - uv.lock
      - src/arabic_sentiment_mlops/tracking.py
    params:
      - base.seed
      - prepare.output_dir
      - train.model_name
      - train.batch_size
      - train.epochs
      - train.learning_rate
      - train.max_length
      - train.validation_size
      - train.model_output_dir
    outs:
      - models/sentiment_bert

  evaluate:
    cmd: uv run python src/arabic_sentiment_mlops/evaluate.py
    deps:
      - data/processed/test.csv
      - models/sentiment_bert
      - src/arabic_sentiment_mlops/evaluate.py
      - pyproject.toml
      - uv.lock
    params:
      - prepare.output_dir
      - train.model_output_dir
      - evaluate.metrics_path
    metrics:
      - metrics.json:
          cache: false