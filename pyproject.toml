[project]
name = "arabic-sentiment-mlops"
version = "0.1.0"
description = "TBD"
readme = "README.md"
authors = [
    { name = "Omar Farghaly", email = "omarfarghaly.12@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.1.0",
    "datasets>=5.0.1",
    "fastapi>=0.142.2",
    "pandas>=3.0.6",
    "pydantic>=2.0",
    "scikit-learn>=1.9.1",
    "torch>=2.7.1",
    "transformers>=5.18.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dvc[gdrive]>=3.67.1",
    "pyopenssl>=25",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
